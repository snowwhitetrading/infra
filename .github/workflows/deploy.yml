name: Data pipeline + deploy (hourly)

on:
  schedule:
    - cron: '0 * * * *'      # MỖI GIỜ — scrape 16 báo → radar → newsflow → promote → build → deploy
  workflow_dispatch:          # cho phép bấm chạy tay
  # KHÔNG chạy theo push nữa: push (sửa UI/template) do site.yml lo, deploy nhanh ~1 phút

permissions:
  contents: read
  pages: write
  id-token: write

# Group RIÊNG cho pipeline dữ liệu (KHÔNG dùng chung 'pages' với site.yml) và KHÔNG cho hủy —
# nếu không, mỗi push (site.yml 'Deploy site fast', cùng group pages, cancel-in-progress) sẽ HỦY
# pipeline hourly đang chạy dở ở bước scrape/newsflow → web đứng tin. Deploy Pages đã được serialize
# sẵn qua environment github-pages nên không cần chung group với site.yml.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Scrape GENERAL: ~23 từ khoá loại-hình/sự-kiện trên cafef/vnex/tuổitrẻ/thanhniên/vnn... +RSS
      # → bài khớp dự án vào project_news_raw · bài hạ tầng chưa khớp → unmatched_raw (pool radar)
      # Backfill lịch sử theo TÊN dự án chạy thủ công: python step1_scrape_news.py --mode project --pages 6
      - name: Scrape project news
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: timeout 780 python step1_scrape_news.py --mode general --pages 3 || echo "scrape skipped/timeout"

      # Radar + TỰ ADD: pool tin chưa khớp → tên dự án MỚI (loại+địa danh) → lọc (≥2 báo & ≥3 lần
      # + ngữ cảnh dự án + tên riêng VN + không trùng) → tự thêm vào registry (bỏ duyệt tay)
      - name: Radar candidates
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: timeout 180 python step2_radar.py --top 0 --auto-add || echo "radar skipped/timeout"

      # Newsflow daily: quét dc_news → lọc cột mốc → Infra_Newsflow (deterministic)
      - name: Ingest newsflow
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python step3_newsflow.py --days 30 || echo "newsflow skipped"

      # Tự động đưa tin cột mốc thành mark 'auto' trên Gantt (deterministic)
      - name: Promote newsflow to tracker
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python step4_promote_marks.py || echo "promote skipped"

      # Dựng site từ DB (Tracker chi tiết + mark auto)
      - name: Build site
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: |
          mkdir -p dist
          python step5_build_site.py --out dist/index.html
          # ảnh vệ tinh (nếu có) để Pages phục vụ cùng trang
          if [ -d satellite_export ]; then cp -r satellite_export dist/satellite_export; fi
          # tên miền riêng (GitHub Pages đọc file CNAME)
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
