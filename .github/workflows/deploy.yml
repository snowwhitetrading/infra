name: Build & Deploy tracker

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *'    # MỖI 3 GIỜ (00,03,06,09,12,15,18,21 UTC = 07,10,13,16,19,22,01,04 giờ VN)
  workflow_dispatch:          # cho phép bấm chạy tay

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Tìm tin dự án trực tiếp trên cafef (bắt tin chính sách bị sót) → cafef_project_news
      - name: Scrape project news
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python step1_scrape_news.py --pages 2 || echo "scrape skipped"

      # Newsflow daily: quét dc_news → lọc cột mốc → Infra_Newsflow (deterministic)
      - name: Ingest newsflow
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python step2_newsflow.py --days 30 || echo "newsflow skipped"

      # Radar: phát hiện dự án hạ tầng quan trọng chưa có trong registry
      - name: Radar candidates
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python step5_radar.py --top 0 || echo "radar skipped"

      # Tự động đưa tin cột mốc thành mark 'auto' trên Gantt (deterministic)
      - name: Promote newsflow to tracker
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python step3_promote_marks.py || echo "promote skipped"

      # Dựng site chính thức (chỉ mark đã duyệt) từ DB
      - name: Build site
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: |
          mkdir -p dist
          python step4_build_site.py --out dist/index.html
          # ảnh vệ tinh (nếu có) để Pages phục vụ cùng trang
          if [ -d satellite_export ]; then cp -r satellite_export dist/satellite_export; fi
          # tên miền riêng (GitHub Pages đọc file CNAME)
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
