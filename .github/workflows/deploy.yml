name: Build & Deploy tracker

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'      # 01:00 UTC MỖI NGÀY = 08:00 giờ VN
  workflow_dispatch:          # cho phép bấm chạy tay

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Newsflow daily: quét dc_news → lọc cột mốc → Infra_Newsflow (deterministic)
      - name: Ingest newsflow
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python newsflow_ingest.py --days 30 || echo "newsflow skipped"

      # Cập nhật mark ứng viên từ tin tức (regex, không cần LLM)
      - name: Propose marks
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python propose_marks.py || echo "propose skipped"

      # Dựng site chính thức (chỉ mark đã duyệt) từ DB
      - name: Build site
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: |
          mkdir -p dist
          python build_tracker.py --out dist/index.html
          # tên miền riêng (GitHub Pages đọc file CNAME)
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
