name: Tiến độ · Chấm nhịp độ + % (hằng tháng · Claude)

on:
  schedule:
    - cron: '0 1 1 * *'      # 01:00 UTC ngày 1 hàng tháng = 08:00 VN — chấm tháng vừa kết thúc
  workflow_dispatch:          # cho phép bấm chạy tay (test / chạy bù)

jobs:
  pace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code

      - name: Chấm + ghi tiến độ tháng (Claude Pro/Max, không tính phí token)
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash run_pace_monthly.sh
