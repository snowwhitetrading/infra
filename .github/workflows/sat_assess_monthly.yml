name: Vệ tinh · Nhận xét ảnh (hằng tháng · Claude)

on:
  schedule:
    - cron: '0 3 1 * *'       # 03:00 UTC ngày 1 hàng tháng = 10:00 VN (sau khi ảnh đã cập nhật)
  workflow_dispatch:           # cho phép bấm chạy tay

jobs:
  sat:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # ~100+ dự án × claude đọc ảnh → có thể lâu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code

      - name: Trust workspace (để Claude được Read ảnh)
        run: |
          python -c "import json,os,pathlib;p=pathlib.Path.home()/'.claude.json';d=json.loads(p.read_text()) if p.exists() else {};d.setdefault('projects',{})[os.getcwd()]={'hasTrustDialogAccepted':True};p.write_text(json.dumps(d))"

      - name: Claude đọc ảnh vệ tinh → nhận xét (ghi Mongo)
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash run_sat.sh
