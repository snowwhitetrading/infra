<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theo dõi dự án bất động sản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>/*__BASE_CSS__*/</style>
<style>
/* ---- riêng trang Bất động sản (phần còn lại dùng chung giao diện với trang Hạ tầng) ---- */
.re-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.re-top a{font-size:12.5px;color:var(--build);text-underline-offset:2px}
.re-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 18px}
.re-kpi{border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px;background:var(--paper,#fff)}
.re-kpi b{display:block;font-family:"Manrope",monospace;font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.re-kpi span{font-size:11.5px;color:var(--ink2);line-height:1.35;display:block;margin-top:2px}
.re-kpi b.pos{color:var(--done)} .re-kpi b.neg{color:var(--alert)}
.pos{color:var(--done)} .neg{color:var(--alert)}
.rb{display:flex;align-items:flex-end;gap:3px;height:46px}
.rb i{flex:1;min-width:9px;max-width:20px;background:var(--build);opacity:.38;border-radius:2px 2px 0 0;position:relative;display:block}
.rb i.last{opacity:1}
.rb i em{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;color:var(--ink2);font-family:"Manrope",monospace;white-space:nowrap}
.rb.ls i{background:var(--ink3)}
.re-tb td{vertical-align:middle}
.re-tb tr.re-row{cursor:pointer}
.re-tb tr.re-row:hover{background:var(--hover)}
.re-det td{background:var(--callout);padding:12px 14px !important}
.re-det .tb{font-size:11.5px}
.re-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.nw{border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px;background:var(--paper,#fff)}
.nw h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.45}
.nw .meta{font-size:11px;color:var(--ink3);margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nw p{margin:6px 0;font-size:12.5px;color:var(--ink2);line-height:1.55}
.nw ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.nw li{margin:3px 0}
.nw a{color:var(--build);text-underline-offset:2px;font-size:11px}
.tone{font-size:10.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--rule2);color:var(--ink2)}
.tone.positive{color:var(--done);border-color:var(--done)} .tone.negative{color:var(--alert);border-color:var(--alert)}
details.more summary{cursor:pointer;font-size:12px;color:var(--build);margin-top:4px}
#re-map{height:620px;border:1px solid var(--rule);border-radius:var(--radius);z-index:0}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:8px 0 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.sat-wrap{display:grid;grid-template-columns:minmax(300px,560px) 1fr;gap:18px;align-items:start}
@media(max-width:900px){.sat-wrap{grid-template-columns:1fr}}
.sat-big{width:100%;border:1px solid var(--rule);border-radius:var(--radius);display:block;image-rendering:auto;background:#111}
.sat-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sat-strip button{border:2px solid transparent;padding:0;background:none;cursor:pointer;border-radius:4px;overflow:hidden;position:relative}
.sat-strip button.on{border-color:var(--build)}
.sat-strip img{width:74px;height:74px;object-fit:cover;display:block}
.sat-strip span{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;color:#fff;background:rgba(0,0,0,.55);text-align:center;font-family:"Manrope",monospace}
.sat-strip button.cl img{opacity:.45}
.sat-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sat-cmp img{width:100%;border:1px solid var(--rule);border-radius:var(--radius-sm,4px);display:block}
</style>
</head>
<body>
<div class="wrap">

<header class="re-top">
  <h1>Theo dõi dự án bất động sản</h1>
  <a href="../">← Trang dự án hạ tầng</a>
</header>

<div class="tabs">
  <button class="tab" data-view="sum" aria-pressed="true">Tổng quan</button>
  <button class="tab" data-view="proj" aria-pressed="false">Dự án</button>
  <button class="tab" data-view="news" aria-pressed="false">Dòng tin</button>
  <button class="tab" data-view="sales" aria-pressed="false">Bán hàng</button>
  <button class="tab" data-view="sat" aria-pressed="false">Vệ tinh</button>
  <button class="tab" data-view="map" aria-pressed="false">Bản đồ</button>
</div>

<div id="view-sum"></div>

<div id="view-proj" class="hidden">
  <div class="map-bar">
    <div class="mf"><span>Sắp xếp</span><select id="p-sort">
      <option value="list" selected>Số tin rao (mặc định)</option>
      <option value="up">Giá tăng mạnh nhất (1 năm)</option>
      <option value="down">Giá giảm mạnh nhất (1 năm)</option>
      <option value="price">Giá bán cao → thấp</option>
      <option value="dlist">Tin rao tăng nhiều nhất (4 tuần)</option>
      <option value="name">Tên dự án</option>
    </select></div>
    <div class="mf"><span>Tỉnh thành</span><select id="p-city"></select></div>
    <div class="mf"><span>Chủ đầu tư</span><select id="p-dev"></select></div>
    <div class="mf"><span>Tìm</span><input id="p-q" type="search" placeholder="Tên dự án / chủ đầu tư" autocomplete="off"></div>
  </div>
  <p class="db-notebox" id="p-note"></p>
  <div id="proj-list"></div>
</div>

<div id="view-news" class="hidden">
  <div class="map-bar">
    <div class="mf"><span>Phân khúc</span><select id="n-seg">
      <option value="">Tất cả</option><option value="residential">Nhà ở</option>
      <option value="industrial">Khu công nghiệp</option><option value="construction">Xây dựng</option>
    </select></div>
  </div>
  <div id="news-list"></div>
</div>

<div id="view-sales" class="hidden"></div>

<div id="view-sat" class="hidden">
  <div class="map-bar">
    <div class="mf"><span>Khu đô thị</span><select id="s-proj"></select></div>
  </div>
  <div id="sat-body"></div>
</div>

<div id="view-map" class="hidden">
  <div class="map-bar">
    <div class="mf"><span>Tô màu theo</span><select id="m-color">
      <option value="yoy" selected>Thay đổi giá 1 năm</option>
      <option value="price">Mức giá bán</option>
      <option value="dlist">Thay đổi tin rao 4 tuần</option>
    </select></div>
    <div class="mf"><span>Hiển thị</span><select id="m-show">
      <option value="all" selected>Dự án có giá + khu đô thị đối ứng</option>
      <option value="proj">Chỉ dự án có giá / tin rao</option>
      <option value="town">Chỉ khu đô thị đối ứng</option>
    </select></div>
    <div class="mf"><span>Lớp nền</span><select id="m-bg">
      <option value="1" selected>Hiện mọi dự án trên Cafeland</option>
      <option value="0">Ẩn</option>
    </select></div>
  </div>
  <div id="re-map"></div>
  <div class="lg" id="m-lg"></div>
  <p class="sum-note" id="m-note"></p>
</div>

<p class="sum-note" id="foot" style="margin-top:26px"></p>
</div>

<script>
const RE = {};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => (Math.round(n)).toLocaleString('vi-VN');
const f1 = n => (Math.round(n*10)/10).toLocaleString('vi-VN');
const SEG = {residential:'Nhà ở', industrial:'Khu công nghiệp', construction:'Xây dựng'};
const TONE = {positive:'tích cực', negative:'tiêu cực', mixed:'trái chiều', neutral:'trung tính'};
const qLab = k => { const m=/(\d{4})-Q(\d)/.exec(k||''); return m?'Q'+m[2]+'/'+m[1].slice(2):(k||''); };
const dLab = d => { const m=/(\d{4})-(\d{2})-(\d{2})/.exec(d||''); return m?(+m[3])+'/'+(+m[2]):(d||''); };
const median = a => { if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), i=s.length>>1; return s.length%2?s[i]:(s[i-1]+s[i])/2; };

/* ---------- chỉ số dẫn xuất của từng dự án ---------- */
RE.projects.forEach(function(p){
  const s=p.sale||[], l=p.list||[];
  p.price = s.length ? s[s.length-1][1] : null;               // giá bán trung bình quý gần nhất (triệu đồng/m²)
  p.pq = s.length ? s[s.length-1][0] : '';
  const prev = s.length>=5 ? s[s.length-5] : null;            // cùng quý năm trước
  p.yoy = (prev && prev[1]) ? (p.price-prev[1])/prev[1]*100 : null;
  const pq = s.length>=2 ? s[s.length-2] : null;
  p.qoq = (pq && pq[1]) ? (p.price-pq[1])/pq[1]*100 : null;
  p.rentv = (p.rent&&p.rent.length) ? p.rent[p.rent.length-1][1] : null;
  p.nlist = l.length ? l[l.length-1][1] : null;
  p.ldate = l.length ? l[l.length-1][0] : '';
  const l4 = l.length>=5 ? l[l.length-5] : null;              // 4 tuần trước
  p.dlist = (l4 && l4[1]) ? (p.nlist-l4[1])/l4[1]*100 : null;
});
const pct = (v,d) => v===null||v===undefined ? '—' : '<span class="'+(v>0.5?'pos':(v<-0.5?'neg':''))+'">'+(v>0?'+':'')+(d?f1(v):Math.round(v))+'%</span>';
function bars(rows, cls, fmt){                                  // rows=[[nhãn, giá trị]]
  if(!rows.length) return '<span class="cap" style="display:inline">—</span>';
  const mx=Math.max.apply(null, rows.map(r=>r[1]||0)) || 1;
  return '<div class="rb '+(cls||'')+'">'+rows.map(function(r,i){
    return '<i class="'+(i===rows.length-1?'last':'')+'" style="height:'+Math.max(6,(r[1]||0)/mx*100).toFixed(0)+'%" title="'+esc(r[0])+': '+esc(fmt?fmt(r[1]):r[1])+'">'
      +(i===rows.length-1||i===0?'<em>'+esc(fmt?fmt(r[1]):r[1])+'</em>':'')+'</i>'; }).join('')+'</div>';
}

/* ---------- TỔNG QUAN ---------- */
function renderSum(){
  const P=RE.projects, wp=P.filter(p=>p.price!==null), wy=P.filter(p=>p.yoy!==null), wl=P.filter(p=>p.nlist!==null);
  const up=wy.filter(p=>p.yoy>2).length, dn=wy.filter(p=>p.yoy<-2).length, flat=wy.length-up-dn;
  const medY=median(wy.map(p=>p.yoy)), medQ=median(P.filter(p=>p.qoq!==null).map(p=>p.qoq));
  const totL=wl.reduce((s,p)=>s+p.nlist,0), wl4=wl.filter(p=>p.dlist!==null);
  const tot4=wl4.reduce((s,p)=>s+p.nlist/(1+p.dlist/100),0), totNow4=wl4.reduce((s,p)=>s+p.nlist,0);
  const dL = tot4 ? (totNow4-tot4)/tot4*100 : null;
  const latestQ = wp.map(p=>p.pq).sort().pop()||'';
  let h='';
  // nhận xét
  const lead = medY===null ? '' :
    (medY>3 ? 'Mặt bằng giá rao bán vẫn đi lên' : (medY<-3 ? 'Mặt bằng giá rao bán đang lùi' : 'Mặt bằng giá rao bán gần như đi ngang'))
    +': dự án trung vị '+(medY>=0?'tăng ':'giảm ')+f1(Math.abs(medY))+'% so với cùng quý năm trước'
    +(medQ!==null?', và '+(medQ>=0?'tăng ':'giảm ')+f1(Math.abs(medQ))+'% so với quý liền trước':'')+'. ';
  const breadth = wy.length ? 'Trong '+wy.length+' dự án đủ chuỗi giá, '+up+' dự án tăng trên 2%, '+dn+' dự án giảm trên 2%, '+flat+' dự án đi ngang'
    +(dn>up?' — số dự án giảm giá đã nhiều hơn số tăng':(up>dn*2?' — đà tăng vẫn lan rộng':''))+'. ' : '';
  const liq = dL===null ? '' : 'Lượng tin rao bán đang hoạt động '+(dL>3?'tăng':(dL<-3?'giảm':'gần như không đổi'))+' '+f1(Math.abs(dL))+'% trong 4 tuần'
    +(dL>3&&medY!==null&&medY<=0?': nguồn hàng rao bán nhiều lên trong khi giá không tăng, dấu hiệu bên bán chịu áp lực hơn':'')
    +(dL<-3&&medY!==null&&medY>0?': hàng rao bán rút bớt trong khi giá còn tăng, bên bán chưa vội':'')+'.';
  h+='<p class="narr">'+lead+breadth+liq+'</p>';
  h+='<div class="re-kpis">'
    +'<div class="re-kpi"><b>'+P.length+'</b><span>dự án đang theo dõi ('+wp.length+' có giá bán, '+wl.length+' có số tin rao)</span></div>'
    +'<div class="re-kpi"><b class="'+(medY>0.5?'pos':(medY<-0.5?'neg':''))+'">'+(medY===null?'—':(medY>0?'+':'')+f1(medY)+'%')+'</b><span>thay đổi giá rao bán trung vị so với cùng quý năm trước ('+esc(qLab(latestQ))+')</span></div>'
    +'<div class="re-kpi"><b>'+up+' / '+dn+'</b><span>số dự án tăng giá / giảm giá trên 2% trong một năm</span></div>'
    +'<div class="re-kpi"><b>'+nf(totL)+'</b><span>tin rao bán đang hoạt động'+(dL!==null?' · '+(dL>0?'+':'')+f1(dL)+'% trong 4 tuần':'')+'</span></div>'
    +'</div>';
  // tăng / giảm mạnh nhất
  const top = (arr,n) => arr.slice(0,n).map(function(p){ return '<tr><td><b>'+esc(p.n)+'</b><span class="cap">'+esc(p.dev||'')+(p.city?' · '+esc(p.city):'')+'</span></td><td class="n">'+f1(p.price)+'</td><td class="n">'+pct(p.yoy)+'</td></tr>'; }).join('');
  const sane=wy.filter(p=>Math.abs(p.yoy)<=50);       // biến động >50%/năm gần như luôn do cơ cấu tin rao đổi, không phải giá thật
  const byUp=sane.slice().sort((a,b)=>b.yoy-a.yoy), byDn=sane.slice().sort((a,b)=>a.yoy-b.yoy);
  h+='<div class="re-grid">'
    +'<div class="sum-sec"><h3 class="sum-h">Giá tăng mạnh nhất trong một năm</h3><table class="tb"><tr><th>Dự án</th><th class="n">Giá (tr/m²)</th><th class="n">1 năm</th></tr>'+top(byUp,8)+'</table></div>'
    +'<div class="sum-sec"><h3 class="sum-h">Giá giảm mạnh nhất trong một năm</h3><table class="tb"><tr><th>Dự án</th><th class="n">Giá (tr/m²)</th><th class="n">1 năm</th></tr>'+top(byDn.filter(p=>p.yoy<0),8)+'</table></div>'
    +'</div><p class="sum-note" style="margin:-10px 0 18px">Giá rao bán trung bình phụ thuộc cơ cấu căn đang rao: một đợt mở bán phân khu mới có thể làm con số nhảy mạnh. Hai bảng trên đã loại các dự án biến động trên 50% trong một năm.</p>';
  // theo chủ đầu tư
  const devs={}; P.forEach(function(p){ const k=p.dev||'(chưa rõ chủ đầu tư)'; (devs[k]=devs[k]||[]).push(p); });
  const rows=Object.keys(devs).map(function(k){ const L=devs[k];
    return {k:k, n:L.length, price:median(L.filter(p=>p.price!==null).map(p=>p.price)), yoy:median(L.filter(p=>p.yoy!==null).map(p=>p.yoy)),
            list:L.reduce((s,p)=>s+(p.nlist||0),0)}; }).filter(r=>r.n>=2).sort((a,b)=>b.n-a.n);
  h+='<div class="sum-sec"><h3 class="sum-h">Theo chủ đầu tư</h3><table class="tb" style="max-width:760px"><tr><th>Chủ đầu tư</th><th class="n">Số dự án</th><th class="n">Giá trung vị (tr/m²)</th><th class="n">Thay đổi 1 năm (trung vị)</th><th class="n">Tin rao</th></tr>'
    +rows.map(r=>'<tr><td><b>'+esc(r.k)+'</b></td><td class="n">'+r.n+'</td><td class="n">'+(r.price===null?'—':f1(r.price))+'</td><td class="n">'+pct(r.yoy)+'</td><td class="n">'+(r.list?nf(r.list):'—')+'</td></tr>').join('')
    +'</table><p class="sum-note">Chỉ liệt kê chủ đầu tư có từ 2 dự án trở lên trong dữ liệu.</p></div>';
  // bản tin tuần
  const W=RE.weekly||{};
  const sec=(t,a)=>a&&a.length?'<p style="margin:10px 0 2px"><b>'+t+'</b></p><ul>'+a.map(x=>'<li>'+esc(x.t)+(x.src&&x.src.length?' '+x.src.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.source||'nguồn')+' ↗</a>').join(' '):'')+'</li>').join('')+'</ul>':'';
  h+='<div class="sum-sec"><h3 class="sum-h">Thị trường trong tuần</h3>'
    +['residential','industrial','construction'].filter(s=>W[s]).map(function(s){ const w=W[s];
      return '<div class="nw"><div class="meta"><span class="pill">'+SEG[s]+'</span><span>'+esc(w.period||w.week)+'</span><span>'+w.n+' bài</span>'
        +(w.tone?'<span class="tone '+esc(w.tone)+'">'+(TONE[w.tone]||esc(w.tone))+'</span>':'')+'</div>'
        +'<p>'+esc(w.summary)+'</p><details class="more"><summary>Tín hiệu giá, chính sách, tín dụng</summary>'
        +sec('Tín hiệu giá',w.price)+sec('Chính sách',w.policy)+sec('Tín dụng, ngân hàng',w.fin)+sec('Định hướng của Chính phủ',w.gov)+'</details></div>'; }).join('')
    +'</div>';
  document.getElementById('view-sum').innerHTML=h;
}

/* ---------- DỰ ÁN ---------- */
let pOpen=new Set(), pAll=false;
function renderProj(){
  const so=document.getElementById('p-sort').value, ci=document.getElementById('p-city').value, de=document.getElementById('p-dev').value,
        q=document.getElementById('p-q').value.trim().toLowerCase();
  let L=RE.projects.filter(p=>(!ci||p.city===ci)&&(!de||p.dev===de)&&(!q||(p.n+' '+p.dev).toLowerCase().includes(q)));
  const nz=(v,d)=>v===null||v===undefined?d:v;
  const S={list:(a,b)=>nz(b.nlist,-1)-nz(a.nlist,-1), up:(a,b)=>nz(b.yoy,-1e9)-nz(a.yoy,-1e9), down:(a,b)=>nz(a.yoy,1e9)-nz(b.yoy,1e9),
           price:(a,b)=>nz(b.price,-1)-nz(a.price,-1), dlist:(a,b)=>nz(b.dlist,-1e9)-nz(a.dlist,-1e9), name:(a,b)=>a.n.localeCompare(b.n,'vi')};
  L.sort(function(a,b){ return S[so](a,b) || a.n.localeCompare(b.n,'vi'); });
  const TOP=60, show=pAll?L:L.slice(0,TOP);
  document.getElementById('p-note').innerHTML='<b>'+L.length+'</b> dự án. Giá là giá <b>rao bán</b> trung bình theo quý (triệu đồng/m²), không phải giá giao dịch. '
    +'Cột “1 năm” so với cùng quý năm trước. Tin rao là số tin đang hoạt động; cột “4 tuần” là thay đổi so với 4 tuần trước. Bấm vào một dòng để xem chi tiết.';
  const row=function(p){ const i=RE.projects.indexOf(p), op=pOpen.has(i);
    let h='<tr class="re-row" data-i="'+i+'"><td><b>'+esc(p.n)+'</b><span class="cap">'+esc(p.dev||'chưa rõ chủ đầu tư')+(p.ticker?' · '+esc(p.ticker):'')+'</span></td>'
      +'<td>'+esc(p.city||'—')+'</td>'
      +'<td class="n"><b>'+(p.price===null?'—':f1(p.price))+'</b>'+(p.pq?'<span class="cap">'+esc(qLab(p.pq))+'</span>':'')+'</td>'
      +'<td class="n">'+pct(p.yoy)+'</td>'

/* ---------- BÁN HÀNG ---------- */
function renderSales(){
  const C=RE.presales||{}, tk=Object.keys(C).sort((a,b)=>{ const la=C[a][C[a].length-1], lb=C[b][C[b].length-1]; return (lb?lb[1]:0)-(la?la[1]:0); });
  const per=[...new Set([].concat(...tk.map(t=>C[t].map(r=>r[0]))))].sort().slice(-8);
  const kLab=k=>{ const m=/(\d{4})Q(\d)/.exec(k); return m?'Q'+m[2]+'/'+m[1].slice(2):k; };
  let h='<p class="narr">Doanh số bán hàng (giá trị hợp đồng ký mới) theo quý của các doanh nghiệp niêm yết có công bố. Đây là thước đo sớm nhất của sức cầu: nó đi trước doanh thu ghi nhận từ một đến ba năm.</p>';
  h+='<div class="sum-sec"><h3 class="sum-h">Theo doanh nghiệp</h3><table class="tb re-tb"><tr><th>Mã</th>'+per.map(k=>'<th class="n">'+kLab(k)+'</th>').join('')+'<th>Xu hướng</th></tr>'
    +tk.map(function(t){ const m={}; C[t].forEach(r=>m[r[0]]=r);
      return '<tr><td><b>'+esc(t)+'</b></td>'+per.map(k=>'<td class="n">'+(m[k]?nf(m[k][1])+(m[k][2]&&m[k][2]!=='high'?'<span class="cap">ước</span>':''):'—')+'</td>').join('')
        +'<td style="min-width:150px">'+bars(C[t].slice(-8).map(r=>[kLab(r[0]),r[1]]),'',nf)+'</td></tr>'; }).join('')
    +'</table><p class="sum-note">Đơn vị: tỷ đồng. “ước” = số do suy ra từ công bố luỹ kế hoặc có độ tin cậy chưa cao.</p></div>';
  const PJ=(RE.presalesProj||[]), lastK=[...new Set(PJ.map(x=>x.k))].sort().slice(-2);
  const rows=PJ.filter(x=>lastK.indexOf(x.k)>=0).sort((a,b)=>b.k.localeCompare(a.k)||b.v-a.v);
  if(rows.length) h+='<div class="sum-sec"><h3 class="sum-h">Theo dự án — hai quý gần nhất</h3><table class="tb" style="max-width:760px"><tr><th>Dự án</th><th>Mã</th><th class="n">Quý</th><th class="n">Doanh số (tỷ)</th></tr>'
    +rows.map(x=>'<tr><td><b>'+esc(x.n)+'</b></td><td>'+esc(x.t)+'</td><td class="n">'+kLab(x.k)+'</td><td class="n">'+nf(x.v)+(x.c&&x.c!=='high'?'<span class="cap">ước</span>':'')+'</td></tr>').join('')+'</table></div>';
  document.getElementById('view-sales').innerHTML=h;
}


/* ---------- VỆ TINH (khu đô thị đối ứng) ---------- */
let sCur=null, sIdx=-1;
const mLab = m => { const a=(m||'').split('-'); return a.length>1?(+a[1])+'/'+a[0]:m; };
function renderSat(){
  // CHỈ dự án đang triển khai: khu đô thị đối ứng đã khởi công + dự án có giá đang xây (RE.satx đã lọc ở bước dựng)
  const TA=(RE.towns||[]).filter(t=>t.sat&&t.sat.length&&t.st==='thi công'), TB=(RE.satx||[]);
  const T=TA.concat(TB), sel=document.getElementById('s-proj'), body=document.getElementById('sat-body');
  if(!T.length){ body.innerHTML='<div class="mp-empty">Chưa có ảnh vệ tinh.</div>'; return; }
  if(!sel.dataset.init){ sel.dataset.init=1;
    const og=(lab,L)=>L.length?'<optgroup label="'+lab+' ('+L.length+')">'+L.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.n)+' ('+t.sat.length+' ảnh)</option>').join('')+'</optgroup>':'';
    sel.innerHTML=og('Khu đô thị đối ứng đã khởi công',TA)+og('Khu đô thị lớn còn đang xây',TB.filter(t=>t.big))+og('Dự án mới mở bán từ 2024',TB.filter(t=>!t.big));
    sel.onchange=function(){ sCur=sel.value; sIdx=-1; renderSat(); }; sCur=String(T[0].id); }
  const t=T.find(x=>String(x.id)===String(sCur))||T[0], A=t.sat, ok=A.filter(x=>x.ok);
  const pj=t.re?RE.projects.find(p=>p.n===t.n):null;
  if(sIdx<0||sIdx>=A.length) sIdx=A.indexOf(ok.length?ok[ok.length-1]:A[A.length-1]);
  const cur=A[sIdx], src=x=>'../satellite_export/'+x.f;
  const first=ok[0], last=ok[ok.length-1];
  const miss=(RE.towns||[]).filter(x=>x.st==='thi công'&&!(x.sat&&x.sat.length));
  const notYet=(RE.towns||[]).filter(x=>x.st!=='thi công');
  const shown={}; TB.forEach(x=>{ shown[x.n]=1; (x.members||[]).forEach(m=>shown[m]=1); });
  const devNo=RE.projects.filter(p=>p.devp&&!shown[p.n]&&!p.lat);
  body.innerHTML='<div class="sat-wrap"><div>'
    +'<img class="sat-big" src="'+esc(src(cur))+'" alt="Ảnh vệ tinh '+esc(t.n)+' '+esc(cur.m)+'">'
    +'<p class="cap" style="margin:6px 0 0">Ảnh chụp '+esc(cur.d)+' · mây che '+Math.round(cur.c)+'% vùng ảnh'+(cur.ok?'':' — ảnh nhiều mây, chỉ để tham khảo')+'</p>'
    +'<div class="sat-strip">'+A.map((x,i)=>'<button class="'+(i===sIdx?'on':'')+(x.ok?'':' cl')+'" data-i="'+i+'" title="'+esc(x.d)+' · mây '+Math.round(x.c)+'%"><img loading="lazy" src="'+esc(src(x))+'" alt=""><span>'+esc(mLab(x.m))+'</span></button>').join('')+'</div>'
    +'</div><div>'
    +'<h3 class="sum-h" style="margin-top:0">'+esc(t.n)+'</h3>'
    +'<table class="tb"><tr><td>Chủ đầu tư</td><td class="n"><b>'+esc(t.dev||'—')+'</b></td></tr>'
    +(pj&&pj.price!==null?'<tr><td>Giá rao bán ('+esc(qLab(pj.pq))+')</td><td class="n"><b>'+f1(pj.price)+' tr/m²</b> · 1 năm '+pct(pj.yoy)+'</td></tr>':'')
    +(pj&&pj.nlist!==null?'<tr><td>Tin rao bán</td><td class="n"><b>'+nf(pj.nlist)+'</b> · 4 tuần '+pct(pj.dlist)+'</td></tr>':'')
    +'<tr><td>Vị trí</td><td class="n">'+esc(t.loc||'—')+'</td></tr>'
    +(t.tmdt?'<tr><td>Quy mô vốn</td><td class="n"><b>'+nf(t.tmdt/1000)+' nghìn tỷ</b></td></tr>':'')
    +(t.win&&t.win[0]?'<tr><td>Khoảng thi công dự kiến</td><td class="n">'+esc(mLab(t.win[0]))+' → '+esc(mLab(t.win[1]||''))+'</td></tr>':'')
    +'<tr><td>Số ảnh dùng được</td><td class="n">'+ok.length+' / '+A.length+' tháng</td></tr></table>'
    +(t.re&&t.why?'<p class="cap" style="margin:8px 0 0">Xếp vào nhóm đang triển khai vì: '+esc(t.why)+'.</p>':'')
    +(t.members&&t.members.length?'<p class="cap" style="margin:6px 0 0">Khung ảnh này gồm cả: '+t.members.map(esc).join(', ')+'.</p>':'')
    +(!t.re&&t.why?'<p class="narr" style="margin-top:12px">'+esc(t.why)+'</p>':'')
    +(first&&last&&first!==last?'<p style="margin:14px 0 0"><b>So sánh đầu kỳ và cuối kỳ</b></p><div class="sat-cmp">'
      +'<div><img loading="lazy" src="'+esc(src(first))+'" alt=""><p class="cap" style="margin:4px 0 0">'+esc(first.d)+'</p></div>'
      +'<div><img loading="lazy" src="'+esc(src(last))+'" alt=""><p class="cap" style="margin:4px 0 0">'+esc(last.d)+'</p></div></div>':'')
    +'</div></div>'
    +'<p class="sum-note" style="margin-top:16px">Ảnh Sentinel-2 (ESA/Copernicus), độ phân giải 10 m: thấy được san nền, đường nội khu, lấn biển, khối công trình lớn; không thấy được chi tiết từng toà nhà. '
    +'Mỗi tháng lấy ảnh ít mây nhất; tháng nào mây che trên 30% thì đánh dấu mờ. Khung ảnh giữ cố định qua các tháng để so sánh. Trang chỉ đưa ảnh, chưa có nhận xét tự động về tiến độ.'
    +' <b>Chỉ hiện dự án đang triển khai</b>: khu đô thị đối ứng đã khởi công, khu đô thị lớn còn đang xây các phân khu (danh sách soát tay), và dự án có giá rao xuất hiện lần đầu từ 2024 trở lại đây. Dự án đã bàn giao không hiện ở đây.'
    +(notYet.length?' '+notYet.length+' khu đô thị đối ứng chưa khởi công nên chưa hiện: '+notYet.map(x=>esc(x.n.replace(/\s*\(.*?\)/,''))).join(', ')+'.':'')
    +(devNo.length?' '+devNo.length+' dự án đang triển khai chưa có ảnh vì chưa có toạ độ: '+devNo.map(x=>esc(x.n)).join(', ')+'.':'')
    +(miss.length?' Chưa có ảnh cho '+miss.length+' khu đô thị đối ứng đã khởi công vì chưa xác định được toạ độ đáng tin: '+miss.map(x=>esc(x.n.replace(/\s*\(.*?\)/,''))).join(', ')+'.':'')+'</p>';
  body.querySelectorAll('.sat-strip button').forEach(b=>b.onclick=function(){ sIdx=+b.dataset.i; renderSat(); });
}

/* ---------- BẢN ĐỒ ---------- */
let MAP=null, MLAY=null, MBG=null, MBGdone=false;
const MCAN = (typeof L!=='undefined') ? L.canvas({padding:.3}) : null;   // hàng nghìn điểm nền vẽ bằng canvas cho nhẹ
function renderMap(){
  if(!MAP){
    MAP=L.map('re-map',{scrollWheelZoom:true}).setView([16.2,106.6],6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP);
    MBG=L.layerGroup().addTo(MAP); MLAY=L.layerGroup().addTo(MAP);
    document.getElementById('m-bg').onchange=renderMap;
    document.getElementById('m-color').onchange=renderMap; document.getElementById('m-show').onchange=renderMap;
    // khung bản đồ đổi kích thước (đổi tab, xoay máy, co giãn cửa sổ) → vẽ lại, tránh bản đồ chỉ hiện một dải
    if(window.ResizeObserver) new ResizeObserver(function(){ MAP.invalidateSize(); }).observe(document.getElementById('re-map'));
    window.addEventListener('resize', function(){ MAP.invalidateSize(); });
  }
  MLAY.clearLayers();
  const bgOn=document.getElementById('m-bg').value==='1';
  if(bgOn && !MBGdone){ MBGdone=true;
    (RE.bg||[]).forEach(function(b){ L.circleMarker([b[1],b[2]],{renderer:MCAN,radius:3,stroke:false,fillColor:'#64748b',fillOpacity:.45}).addTo(MBG)
      .bindPopup('<b>'+esc(b[0])+'</b><br><span style="color:#64748b">'+esc(b[3])+(b[4]?' · '+esc(b[4]):'')+'</span>'+(b[5]?'<br>Giá: '+esc(b[5]):'')+'<br><span style="color:#94a3b8;font-size:11px">Chưa có chuỗi giá, tin rao trong cơ sở dữ liệu</span>'); }); }
  if(bgOn){ if(!MAP.hasLayer(MBG)) MAP.addLayer(MBG); } else if(MAP.hasLayer(MBG)) MAP.removeLayer(MBG);
  const mode=document.getElementById('m-color').value, show=document.getElementById('m-show').value;
  const P=RE.projects.filter(p=>p.lat&&p.lng), T=(RE.towns||[]).filter(t=>t.lat&&t.lng);
  const G='#16a34a', R='#dc2626', N='#94a3b8', B='#2563eb';
  const col=function(p){
    if(mode==='yoy') return p.yoy===null?N:(p.yoy>2?G:(p.yoy<-2?R:'#eab308'));
    if(mode==='dlist') return p.dlist===null?N:(p.dlist>5?R:(p.dlist<-5?G:'#eab308'));
    if(p.price===null) return N; return p.price>=120?'#7c2d12':(p.price>=80?'#c2410c':(p.price>=50?'#f59e0b':'#fde68a'));
  };
  const pts=[];
  if(show!=='town') P.forEach(function(p){
    const r=p.nlist?Math.max(5,Math.min(16,4+Math.sqrt(p.nlist)/2)):5;
    L.circleMarker([p.lat,p.lng],{radius:r,color:'#fff',weight:1,fillColor:col(p),fillOpacity:.85}).addTo(MLAY)
      .bindPopup('<b>'+esc(p.n)+'</b><br><span style="color:#64748b">'+esc(p.dev||'chưa rõ chủ đầu tư')+(p.city?' · '+esc(p.city):'')+'</span>'
        +'<br>Giá rao bán: <b>'+(p.price===null?'—':f1(p.price)+' tr/m²')+'</b>'+(p.pq?' ('+esc(qLab(p.pq))+')':'')
        +'<br>Một năm: '+pct(p.yoy)+' · Tin rao: <b>'+(p.nlist===null?'—':nf(p.nlist))+'</b> ('+pct(p.dlist)+' trong 4 tuần)');
    pts.push([p.lat,p.lng]); });
  if(show!=='proj') T.forEach(function(t){
    L.circleMarker([t.lat,t.lng],{radius:11,color:B,weight:3,fillColor:'#fff',fillOpacity:.9}).addTo(MLAY)
      .bindPopup('<b>'+esc(t.n)+'</b><br><span style="color:#64748b">Khu đô thị đối ứng · '+esc(t.dev)+'</span>'
        +(t.tmdt?'<br>Quy mô vốn: <b>'+nf(t.tmdt/1000)+' nghìn tỷ</b>':'')
        +(t.sat&&t.sat.length?'<br><a href="#sat" onclick="sCur=\''+t.id+'\';sIdx=-1;document.querySelector(\'[data-view=sat]\').click();const s=document.getElementById(\'s-proj\');if(s)s.value='+t.id+';renderSat();return false;">Xem ảnh vệ tinh ('+t.sat.length+' tháng)</a>':''));
    pts.push([t.lat,t.lng]); });
  const lg={yoy:[[G,'tăng trên 2%'],['#eab308','đi ngang'],[R,'giảm trên 2%'],[N,'chưa đủ chuỗi giá']],
            dlist:[[G,'tin rao giảm trên 5% (hàng rút bớt)'],['#eab308','gần như không đổi'],[R,'tin rao tăng trên 5% (hàng ra nhiều)'],[N,'không có số tin rao']],
            price:[['#fde68a','dưới 50 tr/m²'],['#f59e0b','50–80'],['#c2410c','80–120'],['#7c2d12','từ 120 tr/m²'],[N,'chưa có giá']]}[mode];
  document.getElementById('m-lg').innerHTML=lg.map(x=>'<span><i style="background:'+x[0]+'"></i>'+x[1]+'</span>').join('')
    +'<span><i style="background:#fff;border:3px solid '+B+';width:8px;height:8px"></i>khu đô thị đối ứng</span><span><i style="background:#64748b;opacity:.5;width:6px;height:6px"></i>dự án khác trên Cafeland (chưa có chuỗi giá)</span><span>· vòng tròn to hơn = nhiều tin rao hơn</span>';
  document.getElementById('m-note').innerHTML='Lớp nền: '+nf((RE.bg||[]).length)+' dự án bất động sản trên map.cafeland.vn. Có chuỗi giá, tin rao: '+P.length+' / '+RE.projects.length+' dự án và '+T.length+' / '+(RE.towns||[]).length+' khu đô thị đối ứng. '
    +'Vị trí lấy bằng cách ghép tên với dữ liệu map.cafeland.vn; dự án không ghép được chắc chắn thì không hiện, trang không đoán vị trí.';
  setTimeout(function(){ MAP.invalidateSize(); if(pts.length && !MAP._fit){ MAP.fitBounds(pts,{padding:[30,30]}); MAP._fit=1; } },60);
}

/* ---------- khởi tạo ---------- */
(function(){
  const opt=(id,vals,all)=>{ document.getElementById(id).innerHTML='<option value="">'+all+'</option>'+vals.map(v=>'<option>'+esc(v)+'</option>').join(''); };
  opt('p-city',[...new Set(RE.projects.map(p=>p.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi')),'Tất cả tỉnh');
  const dc={}; RE.projects.forEach(p=>{ if(p.dev) dc[p.dev]=(dc[p.dev]||0)+1; });
  opt('p-dev',Object.keys(dc).sort((a,b)=>dc[b]-dc[a]||a.localeCompare(b,'vi')),'Tất cả');
  ['p-sort','p-city','p-dev'].forEach(id=>document.getElementById(id).onchange=function(){ pAll=false; renderProj(); });
  document.getElementById('p-q').oninput=function(){ pAll=false; renderProj(); };
  document.getElementById('n-seg').onchange=renderNews;
  const R={sum:renderSum, proj:renderProj, news:renderNews, sales:renderSales, sat:renderSat, map:renderMap}, done={};
  function go(v){ document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed', b.dataset.view===v));
    Object.keys(R).forEach(k=>document.getElementById('view-'+k).classList.toggle('hidden',k!==v));
    if(!done[v] || v==='map' || v==='sat'){ R[v](); done[v]=1; } try{ history.replaceState(null,'','#'+v); }catch(e){} }
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.view));
  go(R[location.hash.slice(1)]?location.hash.slice(1):'sum');
  document.getElementById('foot').innerHTML='Cập nhật '+esc(RE.asof)+'. Nguồn: giá rao bán, giá thuê và số tin rao từ batdongsan.com.vn; doanh số bán hàng từ công bố của doanh nghiệp; '
    +'bản tin thị trường tổng hợp từ báo chí; ảnh vệ tinh Sentinel-2 (ESA/Copernicus); vị trí từ map.cafeland.vn. Giá rao bán không phải giá giao dịch và thường cao hơn giá chốt thực tế.';
})();
</script>
